name: Daily Australian Price Collector

on:
  schedule:
    - cron: '0 20 * * *' # Runs daily at 8:00 PM UTC
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Price Scraper
        run: python scraper.py

      - name: Commit and Push Updated Prices
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: automated daily price update" || echo "No changes to commit"
          git push
