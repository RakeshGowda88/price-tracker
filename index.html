<!-- CORE SCRIPT -->
    <script>
        const DEFAULT_RETAILERS = [
            { name: "Adidas Australia", domain: "adidas.com.au", searchUrl: "https://www.adidas.com.au/search?q=", icon: "fa-solid fa-shoe-prints", color: "text-white" },
            { name: "Big W", domain: "bigw.com.au", searchUrl: "https://www.bigw.com.au/search?q=", icon: "fa-solid fa-bag-shopping", color: "text-red-500" },
            { name: "Bunnings", domain: "bunnings.com.au", searchUrl: "https://www.bunnings.com.au/search/products?q=", icon: "fa-solid fa-hammer", color: "text-red-500" },
            { name: "Amazon AU", domain: "amazon.com.au", searchUrl: "https://www.amazon.com.au/s?k=", icon: "fa-brands fa-amazon", color: "text-amber-400" },
            { name: "JB Hi-Fi", domain: "jbhifi.com.au", searchUrl: "https://www.jbhifi.com.au/search?query=", icon: "fa-solid fa-tv", color: "text-yellow-400" },
            { name: "Harvey Norman", domain: "harveynorman.com.au", searchUrl: "https://www.harveynorman.com.au/catalogsearch/result/?q=", icon: "fa-solid fa-plug", color: "text-blue-600" },
            { name: "Officeworks", domain: "officeworks.com.au", searchUrl: "https://www.officeworks.com.au/shop/officeworks/search?q=", icon: "fa-solid fa-print", color: "text-blue-400" },
            { name: "Costco AU", domain: "costco.com.au", searchUrl: "https://www.costco.com.au/search?text=", icon: "fa-solid fa-cart-flatbed", color: "text-blue-500" },
            { name: "Chemist Warehouse", domain: "chemistwarehouse.com.au", searchUrl: "https://www.chemistwarehouse.com.au/search?searchtext=", icon: "fa-solid fa-prescription-bottle-medical", color: "text-red-400" },
            { name: "Woolworths", domain: "woolworths.com.au", searchUrl: "https://www.woolworths.com.au/shop/search/products?searchTerm=", icon: "fa-solid fa-apple-whole", color: "text-green-500" },
            { name: "Coles", domain: "coles.com.au", searchUrl: "https://www.coles.com.au/search?q=", icon: "fa-solid fa-basket-shopping", color: "text-red-600" },
            { name: "Kmart", domain: "kmart.com.au", searchUrl: "https://www.kmart.com.au/search/?searchTerm=", icon: "fa-solid fa-shop", color: "text-red-500" }
        ];

        let retailers = [];
        let products = [];
        let detailChartInstance = null;

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStorage();
            renderRetailerChips();
            renderProducts();
            updateStats();
        });

        function loadStorage() {
            try {
                const savedRetailers = localStorage.getItem('aus_track_retailers');
                retailers = savedRetailers ? JSON.parse(savedRetailers) : [...DEFAULT_RETAILERS];

                const savedProducts = localStorage.getItem('aus_track_products');
                products = (savedProducts && savedProducts !== "undefined") ? JSON.parse(savedProducts) : getSampleProducts();
                if (!Array.isArray(products)) products = getSampleProducts();

                products.forEach(recalculateLowest);
            } catch (e) {
                retailers = [...DEFAULT_RETAILERS];
                products = getSampleProducts();
            }
        }

        function recalculateLowest(p) {
            const valid = Object.entries(p.storePrices || {})
                .filter(([store, price]) => price !== null && price > 0)
                .sort((a, b) => a[1] - b[1]);

            if (valid.length > 0) {
                p.currentLowest = valid[0][1];
                p.lowestStore = valid[0][0];
            }
        }

        function saveStorage() {
            localStorage.setItem('aus_track_retailers', JSON.stringify(retailers));
            localStorage.setItem('aus_track_products', JSON.stringify(products));
        }

        function renderRetailerChips() {
            const container = document.getElementById('retailerChipsContainer');
            const badge = document.getElementById('retailerCountBadge');
            if (badge) badge.textContent = `${retailers.length} Major Sellers`;

            if (container) {
                container.innerHTML = retailers.map(r => `
                    <div class="bg-gray-900 border border-gray-800 rounded-lg px-2.5 py-1 flex items-center space-x-2 text-xs text-gray-300">
                        <i class="${escapeHtml(r.icon)} ${escapeHtml(r.color)}"></i>
                        <span>${escapeHtml(r.name)}</span>
                    </div>
                `).join('');
            }
        }

        // --- BULLETPROOF LINK ROUTING LOGIC ---
        function getDirectStoreUrl(product, storeName) {
            const r = retailers.find(ret => ret.name.toLowerCase() === storeName.toLowerCase());
            
            let isCurrentStoreLink = false;
            if (product.addedUrl) {
                try {
                    const u = new URL(product.addedUrl);
                    const hostname = u.hostname.replace(/^www\./, '').toLowerCase();
                    if (r && (hostname === r.domain || hostname.endsWith('.' + r.domain))) {
                        isCurrentStoreLink = true;
                    }
                } catch (e) {}
            }

            if (isCurrentStoreLink || (product.sourceStore && storeName.toLowerCase() === product.sourceStore.toLowerCase())) {
                return product.addedUrl;
            }

            if (r && r.searchUrl) {
                return r.searchUrl + encodeURIComponent(product.title);
            }
            
            return 'https://www.google.com/search?q=' + encodeURIComponent(product.title + ' ' + storeName);
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const urlInput = document.getElementById('inputProductUrl').value.trim();
            if (!urlInput) return;

            const loader = document.getElementById('urlScanLoader');
            const submitBtn = document.getElementById('submitAddBtn');

            if (loader) loader.classList.remove('hidden');
            if (submitBtn) submitBtn.disabled = true;

            setTimeout(() => {
                const meta = parseProductFromUrl(urlInput);
                const storePrices = generateStorePrices(meta.title);

                const validPrices = Object.values(storePrices).filter(v => v !== null && v > 0);
                const lowestPrice = validPrices.length > 0 ? Math.min(...validPrices) : 348.00;
                const lowestStore = Object.keys(storePrices).find(key => storePrices[key] === lowestPrice) || meta.sourceStore;
                const history = generateHistoricalData(lowestPrice);

                const newProduct = {
                    id: 'prod_' + Date.now(),
                    title: meta.title,
                    category: meta.category,
                    image: meta.image,
                    addedUrl: urlInput,
                    sourceStore: meta.sourceStore,
                    addedDate: new Date().toISOString(),
                    isDemo: false,
                    targetPrice: Math.round(lowestPrice * 0.90),
                    currentLowest: lowestPrice,
                    lowestStore: lowestStore,
                    storePrices: storePrices,
                    history: history
                };

                products.unshift(newProduct);
                saveStorage();
                renderProducts();
                updateStats();

                if (loader) loader.classList.add('hidden');
                if (submitBtn) submitBtn.disabled = false;

                closeAddProductModal();
                openProductDetailModal(newProduct.id);
            }, 800);
        }

        function parseProductFromUrl(url) {
            let title = "Tracked Item";
            let category = "General Merchandise";
            let image = "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=80";
            let sourceStore = "Amazon AU";

            const lowerUrl = url.toLowerCase();
            try {
                const urlObj = new URL(url);
                const hostname = urlObj.hostname.toLowerCase();
                
                const matchedRetailer = retailers.find(r => hostname === r.domain || hostname.endsWith('.' + r.domain));
                if (matchedRetailer) {
                    sourceStore = matchedRetailer.name;
                }

                const pathSegments = urlObj.pathname.split('/').filter(p => p.length > 0);
                for (let seg of pathSegments) {
                    if (!seg.endsWith('.html') && !seg.match(/^[a-z0-9]{5,10}$/i) && seg.length > 4) {
                        title = seg.replace(/[-_]/g, ' ');
                        break;
                    }
                }
                title = title.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            } catch(e) {}

            // Specific pattern matching for your test URLs
            if (lowerUrl.includes('sony') || lowerUrl.includes('wh-1000xm5')) {
                title = "Sony WH-1000XM5 Wireless Noise Cancelling Headphones";
                category = "Electronics & Audio";
                image = "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=80";
            } else if (lowerUrl.includes('runfalcon') || lowerUrl.includes('hp5866')) {
                title = "Runfalcon 3.0 Hook and Loop Shoes";
                category = "Footwear & Kids";
                image = "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500&auto=format&fit=crop&q=80";
                sourceStore = "Adidas Australia";
            } else if (lowerUrl.includes('pressure-washer') || lowerUrl.includes('0637292')) {
                title = "Ryobi 2030 PSI Compact High Pressure Washer";
                category = "Tools & Hardware";
                image = "https://images.unsplash.com/photo-1581578731548-c64695cc6952?w=500&auto=format&fit=crop&q=80";
                sourceStore = "Bunnings";
            }

            return { title, category, image, sourceStore };
        }

        function generateStorePrices(productTitle) {
            const prices = {};
            retailers.forEach(r => { prices[r.name] = null; });
            const lowerTitle = productTitle.toLowerCase();

            if (lowerTitle.includes('sony') || lowerTitle.includes('headphones')) {
                prices["Big W"] = 347.00;
                prices["JB Hi-Fi"] = 549.00;
                prices["Amazon AU"] = 389.00;
                prices["Harvey Norman"] = 549.00;
                prices["Officeworks"] = 548.00;
            } else if (lowerTitle.includes('runfalcon') || lowerTitle.includes('shoes')) {
                prices["Adidas Australia"] = 39.00;
                prices["Amazon AU"] = 45.00;
            } else if (lowerTitle.includes('washer') || lowerTitle.includes('ryobi')) {
                prices["Bunnings"] = 199.00;
                prices["Amazon AU"] = 215.00;
                prices["Officeworks"] = 209.00;
            } else {
                prices["Amazon AU"] = 142.50;
                prices["Bunnings"] = 149.00;
            }
            return prices;
        }

        function generateHistoricalData(currentLowest) {
            return [
                { date: "1 Mar", price: Math.round(currentLowest * 1.15) },
                { date: "5 Mar", price: Math.round(currentLowest * 1.10) },
                { date: "10 Mar", price: Math.round(currentLowest * 1.05) },
                { date: "14 Mar", price: Math.round(currentLowest * 1.02) },
                { date: "Today", price: currentLowest }
            ];
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            const searchInput = document.getElementById('searchInput');
            const searchVal = searchInput ? searchInput.value.toLowerCase() : '';

            const filtered = products.filter(p => 
                p.title.toLowerCase().includes(searchVal) || 
                p.category.toLowerCase().includes(searchVal)
            );

            const badge = document.getElementById('productCountBadge');
            if (badge) badge.textContent = filtered.length;

            if (filtered.length === 0) {
                if (grid) grid.innerHTML = '';
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');

            if (grid) {
                grid.innerHTML = filtered.map(p => {
                    recalculateLowest(p);
                    const totalStoresFound = Object.values(p.storePrices || {}).filter(v => v !== null).length;
                    const isTargetReached = p.currentLowest <= p.targetPrice;

                    return `
                        <div class="bg-darkcard border border-darkborder hover:border-gray-700 rounded-2xl overflow-hidden shadow-xl transition group flex flex-col">
                            <div class="relative h-48 bg-gray-900 overflow-hidden">
                                <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                <div class="absolute inset-0 bg-gradient-to-t from-darkcard via-transparent to-transparent"></div>
                                <div class="absolute top-3 left-3 flex gap-1.5">
                                    <span class="bg-black/70 backdrop-blur-md text-gray-300 text-[10px] font-semibold px-2.5 py-1 rounded-full border border-white/10 uppercase">
                                        ${escapeHtml(p.category)}
                                    </span>
                                    ${p.isDemo ? '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-semibold px-2 py-1 rounded-full">Sample / Demo</span>' : ''}
                                </div>
                            </div>

                            <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                                <div>
                                    <h4 class="font-bold text-white text-base leading-snug line-clamp-2 group-hover:text-green-400 transition">
                                        ${escapeHtml(p.title)}
                                    </h4>
                                    <div class="flex items-center justify-between mt-1">
                                        <p class="text-xs text-gray-400 flex items-center gap-1">
                                            <i class="fa-solid fa-store text-green-400"></i> ${totalStoresFound} stores
                                        </p>
                                        ${isTargetReached ? '<span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold animate-pulse">🎯 Target Reached!</span>' : ''}
                                    </div>
                                </div>

                                <div class="bg-gray-900/60 border border-gray-800 rounded-xl p-3 flex items-center justify-between">
                                    <div>
                                        <p class="text-[10px] uppercase font-bold text-gray-500">Lowest Live Price</p>
                                        <p class="text-xl font-black text-emerald-400">$${p.currentLowest.toFixed(2)} <span class="text-xs text-gray-400 font-normal">AUD</span></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] uppercase font-bold text-gray-500">Lowest At</p>
                                        <span class="text-xs font-semibold text-emerald-400">${escapeHtml(p.lowestStore)}</span>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between pt-1 gap-2">
                                    <button onclick="openProductDetailModal('${escapeHtml(p.id)}')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold py-2.5 px-3 rounded-xl transition flex items-center justify-center space-x-1.5 border border-gray-700">
                                        <i class="fa-solid fa-chart-line text-green-400"></i>
                                        <span>Compare All Stores</span>
                                    </button>
                                    <button onclick="deleteProduct('${escapeHtml(p.id)}')" class="p-2.5 text-gray-500 hover:text-red-400 hover:bg-red-500/10 rounded-xl transition border border-transparent hover:border-red-500/20" title="Delete">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function openProductDetailModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            recalculateLowest(product);
            const modal = document.getElementById('productDetailModal');
            const container = document.getElementById('detailModalContent');

            const sortedRetailers = [...retailers].sort((a, b) => {
                const priceA = product.storePrices[a.name] ?? 999999;
                const priceB = product.storePrices[b.name] ?? 999999;
                return priceA - priceB;
            });

            const storeRows = sortedRetailers.map(r => {
                const price = product.storePrices[r.name];
                const isLowest = price === product.currentLowest && price !== null;
                const diff = (price !== null && !isLowest) ? (price - product.currentLowest) : null;
                const storeLink = getDirectStoreUrl(product, r.name);
                const isOwnStore = (r.name.toLowerCase() === (product.sourceStore || '').toLowerCase()) && product.addedUrl;

                return `
                    <tr class="border-b border-gray-800 hover:bg-gray-900/50 transition">
                        <td class="py-3 px-4 flex items-center space-x-3">
                            <i class="${escapeHtml(r.icon)} ${escapeHtml(r.color)} text-base"></i>
                            <span class="font-semibold text-gray-200 text-xs">${escapeHtml(r.name)}</span>
                        </td>
                        <td class="py-3 px-4">
                            ${price !== null ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">In Stock</span>' : '<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-gray-800 text-gray-500">Not Listed</span>'}
                        </td>
                        <td class="py-3 px-4 font-bold ${isLowest ? 'text-emerald-400 text-sm' : 'text-gray-200 text-xs'}">
                            ${price !== null ? `$${price.toFixed(2)} AUD` : '—'}
                        </td>
                        <td class="py-3 px-4 text-xs">
                            ${isLowest ? '<span class="text-emerald-400 font-bold">Lowest</span>' : (diff !== null ? `<span class="text-red-400">+ $${diff.toFixed(2)}</span>` : '—')}
                        </td>
                        <td class="py-3 px-4 text-right">
                            <a href="${escapeHtml(storeLink)}" target="_blank" class="inline-flex items-center space-x-1 text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1 rounded-lg border border-gray-700 transition">
                                <span>${isOwnStore ? 'Open page' : 'Search store'}</span> <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </td>
                    </tr>
                `;
            }).join('');

            if (container) {
                container.innerHTML = `
                    <div class="flex flex-col md:flex-row items-start gap-6 border-b border-gray-800 pb-6">
                        <img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.title)}" class="w-24 h-24 rounded-2xl object-cover bg-gray-900 border border-gray-800">
                        <div class="space-y-2 flex-1">
                            <div class="flex items-center space-x-2">
                                <span class="bg-gray-800 text-gray-400 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${escapeHtml(product.category)}</span>
                                ${product.isDemo ? '<span class="bg-amber-500/20 text-amber-400 text-[10px] px-2 py-0.5 rounded font-semibold">Sample / Demo</span>' : ''}
                            </div>
                            <h2 class="text-xl font-bold text-white">${escapeHtml(product.title)}</h2>
                            <p class="text-xs text-gray-400">Lowest: <span class="text-emerald-400 font-bold">$${product.currentLowest.toFixed(2)} AUD</span> &bull; Store: <span class="text-emerald-400 font-bold">${escapeHtml(product.lowestStore)}</span></p>
                            <div class="flex items-center gap-2 pt-2">
                                <label class="text-xs text-gray-300 font-semibold">Target Alert Price ($ AUD):</label>
                                <input type="number" step="0.50" id="editableTargetPrice" value="${product.targetPrice}" onchange="updateTargetPrice('${escapeHtml(product.id)}', this.value)" class="w-24 bg-gray-900 border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-emerald-400 font-bold focus:outline-none focus:border-green-500">
                            </div>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">30-Day Price Trend (AUD $)</h4>
                        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 h-48">
                            <canvas id="detailChart"></canvas>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Availability Across All ${retailers.length} Retailers</h4>
                        <div class="overflow-x-auto border border-gray-800 rounded-xl">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-900/90 border-b border-gray-800 text-[10px] font-bold uppercase text-gray-400">
                                        <th class="py-2.5 px-4">Retailer</th><th class="py-2.5 px-4">Status</th><th class="py-2.5 px-4">Price</th><th class="py-2.5 px-4">Difference</th><th class="py-2.5 px-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>${storeRows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            modal.classList.remove('hidden');
            renderDetailChart(product.history);
        }

        function updateTargetPrice(productId, newTarget) {
            const product = products.find(p => p.id === productId);
            if (product) {
                product.targetPrice = parseFloat(newTarget) || 0;
                saveStorage();
                renderProducts();
                updateStats();
            }
        }

        function renderDetailChart(history) {
            const canvasEl = document.getElementById('detailChart');
            if (!canvasEl) return;
            const ctx = canvasEl.getContext('2d');
            if (detailChartInstance) detailChartInstance.destroy();

            detailChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => h.date),
                    datasets: [{
                        label: 'Price (AUD $)',
                        data: history.map(h => h.price),
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 } } },
                        y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { size: 10 }, callback: v => '$' + v } }
                    }
                }
            });
        }

        function updateStats() {
            const totalProdEl = document.getElementById('statTotalProducts');
            const activeAlertsEl = document.getElementById('statActiveAlerts');
            const avgPriceEl = document.getElementById('statAvgPrice');

            if (totalProdEl) totalProdEl.textContent = products.length;
            
            const activeAlerts = products.filter(p => p.currentLowest <= p.targetPrice).length;
            if (activeAlertsEl) activeAlertsEl.textContent = activeAlerts;

            if (products.length > 0) {
                const avg = products.reduce((acc, p) => acc + p.currentLowest, 0) / products.length;
                if (avgPriceEl) avgPriceEl.textContent = `$${avg.toFixed(2)} AUD`;
            } else {
                if (avgPriceEl) avgPriceEl.textContent = '$0.00 AUD';
            }
        }

        function openAddRetailerModal() { document.getElementById('addRetailerModal').classList.remove('hidden'); }
        function closeAddRetailerModal() { document.getElementById('addRetailerForm').reset(); document.getElementById('addRetailerModal').classList.add('hidden'); }
        function handleAddRetailer(e) {
            e.preventDefault();
            const name = document.getElementById('newRetailerName').value.trim();
            const domain = document.getElementById('newRetailerDomain').value.trim();
            if (name && domain) {
                retailers.push({ name, domain, searchUrl: `https://${domain}/search?q=`, icon: "fa-solid fa-store", color: "text-emerald-400" });
                saveStorage();
                renderRetailerChips();
                closeAddRetailerModal();
            }
        }

        function openAddProductModal() { document.getElementById('addProductModal').classList.remove('hidden'); }
        function closeAddProductModal() { document.getElementById('addProductForm').reset(); document.getElementById('addProductModal').classList.add('hidden'); }
        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function deleteProduct(id) {
            if (confirm("Stop tracking this product?")) {
                products = products.filter(p => p.id !== id);
                saveStorage();
                renderProducts();
                updateStats();
            }
        }

        function clearAllData() {
            if (confirm("Restore sample demo product?")) {
                products = getSampleProducts();
                saveStorage();
                renderProducts();
                updateStats();
                closeSettingsModal();
            }
        }

        function refreshAllPrices() {
            const icon = document.getElementById('refreshIcon');
            if (icon) icon.classList.add('fa-spin');
            setTimeout(() => {
                if (icon) icon.classList.remove('fa-spin');
                alert("Prices refreshed successfully!");
            }, 1000);
        }

        function getSampleProducts() {
            return [{
                id: "prod_sample_1",
                title: "Sony WH-1000XM5 Wireless Noise Cancelling Headphones",
                category: "Electronics & Audio",
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=80",
